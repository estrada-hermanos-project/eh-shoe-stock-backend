# API Java 21 + MySQL 8 + volumen persistente de la base de datos.
# La imagen de la API se construye con el Dockerfile de este directorio.
# Los valores de las variables de entorno se leen del archivo .env (no versionado).

name: eh-shoe-stock

services:
  mysql:
    image: mysql:8.4
    container_name: eh-shoe-stock-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME es obligatorio}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME es obligatorio}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD es obligatorio}
      TZ: ${TZ:?TZ es obligatorio}
    # 3306 del host ya lo usa MySQL local. 3307 es solo para entrar desde Windows
    # (Workbench, etc.). Entre contenedores MySQL sigue en el 3306 interno.
    ports:
      - "3307:3306"
    volumes:
      - ./volumes/mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      # $$ evita la interpolación de Compose: las variables las resuelve el shell del contenedor.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - eh-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: eh-shoe-stock-backend:latest
    container_name: eh-shoe-stock-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:?SERVER_PORT es obligatorio}
      DB_HOST: ${DB_HOST:?DB_HOST es obligatorio}
      DB_PORT: ${DB_PORT:?DB_PORT es obligatorio}
      DB_NAME: ${DB_NAME:?DB_NAME es obligatorio}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME es obligatorio}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:?JPA_DDL_AUTO es obligatorio}
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN es obligatorio}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:?JWT_EXPIRATION_MINUTES es obligatorio}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?FRONTEND_BASE_URL es obligatorio}
      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST es obligatorio}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT es obligatorio}
      MAIL_USERNAME: ${MAIL_USERNAME:?MAIL_USERNAME es obligatorio}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?MAIL_PASSWORD es obligatorio}
      TZ: ${TZ:?TZ es obligatorio}
    ports:
      - "8080:8080"
    networks:
      - eh-net

networks:
  eh-net:
    name: eh-shoe-stock-net
